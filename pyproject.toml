[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Honeypot"
description = "Honeypot"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "requests",
    "docker",
    "loguru>=0.7.3",
    "asyncssh>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.38.0",
    "ruff>=0.15.1",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock"
]


[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.basedpyright]
# docker-py and loguru ship incomplete stubs — unknown/Any diagnostics are their fault
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
