[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Honeypot"
descriptipn = "Honeypot"
dynamic = ["version"]
requires-python = "==3.12"
dependencies = [
    "requests",
    "docker",
    "disutils"
]

[project.optional-dependencies]
typing = [
    "mypy"
]
linter =[
    "pylint"
]
test = [
    "pytest"
]


[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"